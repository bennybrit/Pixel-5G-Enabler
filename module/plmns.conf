# Network codes (PLMNs) the module works on: one MCC+MNC per line, 5 or 6 digits (315-010 is 315010).
# SIMs with these codes get the module's modem profile and carrier settings.
# Edit this file, then reboot the phone.
00101      # 001-01, the 3GPP test network
315010     # 315-010, US CBRS shared spectrum
99970      # 999-70, private network range
